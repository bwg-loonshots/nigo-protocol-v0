window.onload = async () => {
	if(!window.ethereum){
		document.getElementById('address').innerHTML = '메타마스크가 없습니다'
		return
	}
	web3 = new Web3(window.ethereum)
	try{
		const address = await web3.eth.requestAccounts()
		document.getElementById('address').innerHTML = accountAddr = address[0]
	}catch(e){
		document.getElementById('address').innerHTML = 'fail to request account'
		return
	}	
}
