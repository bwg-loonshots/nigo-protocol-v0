<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="./../js/include.js"></script>
<script src="./../js/tool.js"></script>
<script src="./../js/tokenDatas.js"></script>
<script src="../../js/tokenAbi.js"></script>
<script src="../../js/pairAbi.js"></script>
<script src="./../js/stakeAbi.js"></script>
<script src="./../js/modal.js"></script>
<script src="./../js/loading.js"></script>
<link rel="stylesheet" type="text/css" href="../css/swap.css">
<title>swap</title>
</head>
<body>
<div id="page-wrapper">
	<header data-include="../include/header.html"></header>
	<div id="main-wrapper">
		<div id="head">Deposited Swap</div>
		<div id="from" class="token">
			<input id="input" type="number" value="0.0" oninput="checkOpp()"/>
			<div id=tokenIn>
				<button id="symbol_from" class="searchToken" onclick="modalOn('from')">tokenList</button>
				<div class="deposited_box">deposited : <span id="deposited_from">0</span></div>
			</div>
		</div>
		<div id="switch">V</div>
		<div id="to" class="token">
			<input id="output" type="number" value="0.0" disabled="disabled"/>
			<div id=tokenOut>
				<button id="symbol_to" class="searchToken" onclick="modalOn('to')">tokenList</button>
				<div class="deposited_box">deposited : <span id="deposited_to">0</span></div>
			</div>
		</div>
		<div class="info">
			<div class="fee_box">transaction fee</div>
			<div class="fee_box"><span id="fee">0</span> ETH</div>
		</div>
		<div id="action" class="token disable" onclick="swap()">
			<h1>swap</h1>
		</div>
	</div>
</div>

<modal data-include="../include/modal.html" ></modal>
<modal data-include="../include/loading.html" ></modal>

<script type="text/javascript">
let web3;
let accountAddr;
const curtoken={"from":{},"to":{}};
let txOption;
let target;
let pair={};
const pool = {"address":stakingPoolAddress};
const emptyAddr = "0x0000000000000000000000000000000000000000";
const DEX18 = 10**18 
const DEX9 = 10**9 

async function connect(){
	try{
		const address = await web3.eth.requestAccounts()
		accountAddr = address[0]
		document.getElementById('connect').innerHTML = accountAddr.slice(0,7) + '...'
		pool["contract"] = new web3.eth.Contract(stakingPoolAbi,pool["address"])
	}catch(e){
		alert('fail to request account')
		return
	}
}

window.onload = function(){
	if(window.ethereum){
		web3 = new Web3(window.ethereum)
		document.getElementById('connect').innerHTML='connect wallet'
		connect()
	}else{
		document.getElementById('connect').innerHTML='메타마스크가 없습니다'	
	}
}

    
async function modalOn(_target) {
	target = _target
	showLoading();
	await tokenList()
	hideLoading();
	modalShow()
}
    
async function tokenList(){
	let tokenList = "";
	const filter = document.getElementById("filter").value;
	
	for(token of tokenDatas){
		if(filter && ( !token.symbol.includes(filter) && !token.name.includes(filter))){
			continue;
		}
		
		const tokenInfo = await getTokenInfo(token)
		
 		const image = token.image ? token.image : "../img/white.webp"

 		tokenList += tokenItem(token.symbol,image,token.name, tokenInfo["deposited"])
 	}
	document.getElementById("tokenListBox").innerHTML = tokenList
}

async function choiceToken(symbol){
	
	for(token of tokenDatas){
 		if(token.symbol != symbol){
 			continue;
 		}
 		document.getElementById('symbol_'+target).innerHTML = symbol;
 		curtoken[target] = await getTokenInfo(token);
 		document.getElementById('deposited_'+target).innerHTML = curtoken[target]["deposited"] 
 		break;
 	}
	
	target="";
	 
	modalOff()
	
	checkPair()
}

async function getTokenInfo(token){
	const targetToken = {"address":token.address};
	targetToken["symbol"] = token.symbol
	targetToken["stAddress"] = await pool["contract"].methods.stakedOf(targetToken["address"]).call()
	if(targetToken["stAddress"] != emptyAddr){
		targetToken["contract"] = new web3.eth.Contract(tokenAbi,targetToken["address"])
		targetToken["stContract"] = new web3.eth.Contract(tokenAbi,targetToken["stAddress"])
		targetToken["stBalance"] = await targetToken["stContract"].methods.balanceOf(accountAddr).call();
 		const { minted, reserved } = await pool["contract"].methods.mintedByReserved(token.address).call();
 		targetToken["totalSupply"] = minted;
 		targetToken["totalDeposited"] = reserved; 
 		targetToken["deposited"] = (targetToken["stBalance"] / DEX18 * targetToken["totalDeposited"] / targetToken["totalSupply"]).toFixed(4)
	}else{
		targetToken["deposited"] = 0;
	}
	return targetToken;
}
 
async function checkPair(){
	if( !curtoken["from"]["stAddress"] || !curtoken["to"]["stAddress"] ){
		return;
	}
	
	pair["address"] = await findPair(curtoken["from"]["stAddress"],curtoken["to"]["stAddress"])
	if(pair["address"] == emptyAddr){
		alert("no pair. please add liquidity")
		return
	}
	pair["contract"] = new web3.eth.Contract(pairAbi,pair["address"])
	
	const { 0:amountA, 1:amountB } = await pair["contract"].methods.getReserves().call()
	
	if( curtoken["from"]['stAddress'] < curtoken["to"]['stAddress'] ){
		curtoken["from"]["reserved"] = amountA;
		curtoken["to"]["reserved"] = amountB;
	}else{
		curtoken["from"]["reserved"] = amountB;
		curtoken["to"]["reserved"] = amountA;
	}
	checkOpp( )
}
 
async function checkOpp( ){
	
	if(pair["address"] == emptyAddr){
		return
	}

	const input = mul18(document.getElementById("input").value)
	
	const stInput = input * curtoken["from"]["totalSupply"] / curtoken["from"]["totalDeposited"];
	const stOutput = amountOutWithSwapFee(stInput);
	const output = stOutput / DEX18 * curtoken["to"]["totalDeposited"] / curtoken["to"]["totalSupply"] ;
	
	document.getElementById("output").value = output.toFixed(4)
	
	if(curtoken["from"]["stBalance"] >= stInput){
		document.getElementById('action').classList.remove('disable')
		txFee(stInput)
	}else{
		document.getElementById('action').classList.add('disable')
	}
}

async function txFee(amount){
	
	const baseFee = await web3.eth.getBlock("latest").then((block) => {return Number(block.baseFeePerGas)})
	
	const priorityFee = await web3.eth.getFeeHistory(1, "latest", [50]).then(getPriorityByFeehistory);
	const amountStr = String(amount)
	let units = await pool["contract"].methods.swap(curtoken["from"]["stAddress"],curtoken["to"]["stAddress"],amountStr).estimateGas({from:accountAddr})
	if(units < 21000){
		units = 21000
	}
	txOption = {
		from : accountAddr,
		maxPriorityFeePerGas : priorityFee,
		maxFeePerGas : baseFee + priorityFee,
		gasLimit : units > 21000 ? units : 21000
	}
	document.getElementById("fee").innerHTML = ((baseFee + priorityFee) * units / DEX18).toFixed(4)
}

function amountOutWithSwapFee(stInput){
	const amountInWithFee = stInput * 9970;
	const numerator = amountInWithFee * curtoken["to"]["reserved"];
	const denominator = curtoken["from"]["reserved"] * 10000 + amountInWithFee;
	return numerator / denominator;
}

async function findPair(_tA, _tB){
	const { tA, tB } = _tA < _tB ? { tA:_tA, tB:_tB } : { tA:_tB, tB:_tA } 
	return await pool["contract"].methods.pairOf(tA,tB).call();
}

async function swap(){
	const amount = String(mul18(document.getElementById("input").value) * curtoken["from"]["totalSupply"] / curtoken["from"]["totalDeposited"])
	await pool["contract"].methods.swap(curtoken["from"]["stAddress"],curtoken["to"]["stAddress"],amount).send(txOption);
	target = "from"
	await choiceToken(curtoken["from"]["symbol"])
	target = "to"
	await choiceToken(curtoken["to"]["symbol"])
}

</script>
</body>
</html>
