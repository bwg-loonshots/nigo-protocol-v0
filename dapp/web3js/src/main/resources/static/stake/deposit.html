<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="./../js/tool.js"></script>
<script src="./../js/include.js"></script>
<script src="./../js/tokenDatas.js"></script>
<script src="./../js/tokenAbi.js"></script>
<script src="./../js/stakeAbi.js"></script>
<script src="./../js/modal.js"></script>
<link rel="stylesheet" type="text/css" href="../css/deposit.css">
<title>Deposit</title>
</head>
<body>
<div id=page-wrapper>
	<header data-include="../include/header.html"></header>
	<div id="main-wrapper">
		<div id="head">Deposit</div>
		<div id="from" class="token">
			<button id="tokenInButton" onclick="modalOn()">tokenList</button>
			<div id=tokenIn>
				<div class="balance_box">balance : <span id="balance">0</span></div>
				<div class="balance_box">deposited : <span id="deposited">0</span></div>
			</div>
		</div>
		<div class="info">
			<div id="amountBox">
				<div>Amount</div>
				<input id="amount" type="number" oninput="checkAllowance()" value="0.0"/>
			</div>
		</div>
		<div class="info">
			<div class="fee_box">transaction fee</div>
			<div class="fee_box"><span id="fee">0</span> ETH</div>
		</div>
		<div id="approve" class="info" onclick="approve()">
			<h1>APPROVE</h1>
		</div>
		<div id="action" class="token disable" onclick="deposit()">
			<h1>DEPOSIT</h1>
		</div>
	</div>
</div>

<modal data-include="../include/modal.html" ></modal>

<script type="text/javascript">
let web3;
let accountAddr;
const emptyAddr = "0x0000000000000000000000000000000000000000";
let txOption;
const curtoken={};
const pool = {"address":"0x94945D39a0db93b01fc108012778CEC79507f49b"};
const DEX18 = 10**18 
const DEX9 = 10**9 

async function connect(){
	try{
		const address = await web3.eth.requestAccounts()
		accountAddr = address[0]
		document.getElementById('connect').innerHTML = accountAddr.slice(0,7) + '...'
		pool["contract"] = new web3.eth.Contract(stakingPoolAbi,pool["address"])
	} catch(e){
		alert('fail to request account')
		return
	} 
}

window.onload = function(){
	if(window.ethereum){
		web3 = new Web3(window.ethereum)
		document.getElementById('connect').innerHTML='connect wallet'
		connect()
	}else{
		document.getElementById('connect').innerHTML='메타마스크가 없습니다'	
	}
}  

async function modalOn() {
	await tokenList()
	modalShow()
}
 	
async function tokenList(){
	let tokenList = "";
	for(token of tokenDatas){
		const filter = document.getElementById("filter").value;
		if(filter && ( !token.symbol.includes(filter) && !token.name.includes(filter))){
			continue;
		}
		
 		const image = token.image ? token.image : "../img/white.webp"
 		const tokenContract = new web3.eth.Contract(tokenAbi,token.address)
 		const balance = (await tokenContract.methods.balanceOf(accountAddr).call() / DEX18).toFixed(4)
 		tokenList += tokenItem(token.symbol,image,token.name,balance)
 	}
	document.getElementById("tokenListBox").innerHTML = tokenList
 }
 
 async function choiceToken(symbol){

 	for(token of tokenDatas){
 		if(token.symbol != symbol){
 			continue;
 		}
 		curtoken["address"] = token.address;
 		document.getElementById('tokenInButton').innerHTML = curtoken["symbol"] = symbol;
 		curtoken["contract"] = new web3.eth.Contract(tokenAbi,curtoken["address"])
 		curtoken["balance"] = await curtoken["contract"].methods.balanceOf(accountAddr).call()
 		document.getElementById('balance').innerHTML = ( curtoken["balance"] / DEX18).toFixed(4)
 		curtoken["stAddress"] = await pool["contract"].methods.stakedOf(curtoken["address"]).call()
 		if(curtoken["stAddress"] != emptyAddr){
 			curtoken["stContract"] = new web3.eth.Contract(tokenAbi,curtoken["stAddress"])
 			curtoken["stBalance"] = await curtoken["stContract"].methods.balanceOf(accountAddr).call() 
 	 		document.getElementById('deposited').innerHTML= await convertStToOrg();	
 		}else{
 			document.getElementById('deposited').innerHTML=0;
 		}
 		modalOff()
 		checkAllowance()
 		break;
 	}
 }
 
 async function checkDeposit(amount){
	 const approveState = document.getElementById('approve').style.display;
	 if( amount > curtoken["balance"] || approveState=='flex' ){
		 document.getElementById('action').classList.add('disable')
	 }else{
		 document.getElementById('action').classList.remove('disable')
	 }
	 
 }
 
 async function checkAllowance(){
	 if(!curtoken["address"]){
		 return;
	 }
	 
	 const allowance = await curtoken["contract"].methods.allowance(accountAddr,pool["address"]).call()
	 const amount = mul18(document.getElementById('amount').value)
	 if(amount > allowance){
		 document.getElementById('approve').style.display = "flex";
	 }else{
		 document.getElementById('approve').style.display = "none";
		 txFee(amount)
	 }
	 checkDeposit(amount)
 }
 
async function approve(){
	const amount = String(mul18(document.getElementById('amount').value)) 
	await curtoken["contract"].methods.approve(pool["address"],amount).send({from:accountAddr})
	checkAllowance()
}
 
async function deposit(){
	const amount = String(mul18(document.getElementById('amount').value))
	await pool["contract"].methods.stake(curtoken["address"],amount).send(txOption)
}

async function txFee(amount){
	
	const baseFee = await web3.eth.getBlock("latest").then((block) => {return Number(block.baseFeePerGas)})
	
	const priorityFee = await web3.eth.getFeeHistory(1, "latest", [50]).then(getPriorityByFeehistory);
	
	let units = 0
	
	if(document.getElementById('amount').value > 0){
		
		const amountStr = String(amount)
		units = await pool["contract"].methods.stake(curtoken["address"],amountStr).estimateGas({from:accountAddr})
		if(units < 21000){
			units = 21000
		}
		txOption = {
			from : accountAddr,
			maxPriorityFeePerGas : priorityFee,
			maxFeePerGas : baseFee + priorityFee,
			gasLimit : units > 21000 ? units : 21000
		}	
	}
	document.getElementById("fee").innerHTML = ((baseFee + priorityFee) * units / DEX18).toFixed(4)
}

async function convertStToOrg(){
	const totalSupply = await curtoken["stContract"].methods.totalSupply().call()
	const totalDeposited = await curtoken["contract"].methods.balanceOf(curtoken["stAddress"]).call()
	const deposited = (curtoken["stBalance"] / DEX18 * totalDeposited / totalSupply).toFixed(4)
	return deposited
}
</script>
</body>
</html>
