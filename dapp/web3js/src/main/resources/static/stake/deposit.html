<!DOCTYPE html>
<html>
<head>
<meta charset="EUC-KR">
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="./../js/tool.js"></script>
<script src="./../js/include.js"></script>
<script src="./../js/tokenDatas.js"></script>
<script src="./../js/tokenAbi.js"></script>
<script src="./../js/stakeAbi.js"></script>
<link rel="stylesheet" type="text/css" href="../css/modal.css">
<link rel="stylesheet" type="text/css" href="../css/deposit.css">
<title>Deposit</title>
</head>
<body>
<div id=page-wrapper>
	<header data-include="../include/header.html"></header>
	<div id="main-wrapper">
		<div id="head">Deposit</div>
		<div id="from" class="token">
			<button id="tokenInButton" onclick="modalOn()">tokenList</button>
			<div id=tokenIn>
				<div class="balance_box">balance : <span id="balance">0</span></div>
				<div class="balance_box">deposited : <span id="deposited">0</span></div>
			</div>
		</div>
		<div class="token">
			<div id="amountBox">
				<div>Amount</div>
				<input id="amount" type="number" oninput="checkAllowance()" value="0.0"/>
			</div>
		</div>
		<div class="token">
			<div class="fee_box">transaction fee</div>
			<div class="fee_box"><span id="fee">0</span> ETH</div>
		</div>
		<div id="approve" class="token" onclick="approve()">
			<h1>APPROVE</h1>
		</div>
		<div id="action" class="token disable" onclick="deposit()">
			<h1>DEPOSIT</h1>
		</div>
	</div>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal-window">
        <div class="title">
            <h2>Token List</h2>
        </div>
        <div class="close-area">X</div>
        <div class="content">
        	<div id="filter_box">
        		<input id="filter" type="text"/>
        	</div>
        	<ul id="tokenListBox" style="overflow: scroll; height: 400px;">
        	</ul>
        </div>
    </div>
</div>

<script type="text/javascript">
let web3;
let accountAddr;
let currentToken;
let currentTokenBalance;
let currentTokenContract;
let txOption;
const poolAddr = "0x94945D39a0db93b01fc108012778CEC79507f49b";
const emptyAddr = "0x0000000000000000000000000000000000000000";
let poolContract;
const DEX18 = 10**18 
const DEX9 = 10**9 

async function connect(){
	try{
		const address = await web3.eth.requestAccounts()
		accountAddr = address[0]
		document.getElementById('connect').innerHTML = accountAddr.slice(0,7) + '...'
		poolContract = new web3.eth.Contract(stakingPoolAbi,poolAddr)
	}catch(e){
		alert('fail to request account')
		return
	}
}

window.onload = function(){
	if(window.ethereum){
		web3 = new Web3(window.ethereum)
		document.getElementById('connect').innerHTML='connect wallet'
	}else{
		document.getElementById('connect').innerHTML='메타마스크가 없습니다'	
	}
}  
const modal = document.getElementById("modal")

async function modalOn() {
	await tokenList()
	modal.style.display = "flex"
}

function isModalOn() {
	return modal.style.display === "flex"
}

function modalOff() {
     modal.style.display = "none"
}
const closeBtn = modal.querySelector(".close-area")

closeBtn.addEventListener("click", e => {
	modalOff()
})

modal.addEventListener("click", e => {
	const evTarget = e.target
	if(evTarget.classList.contains("modal-overlay")) {
		modalOff()
	}
})
	
window.addEventListener("keyup", e => {
	if(isModalOn() && e.key === "Escape") {
		modalOff()
	}
})
 	
async function tokenList(){
	let tokenList = "";
	for(token of tokenDatas){
 		const image = token.image ? token.image : "../img/white.webp"
 		const tokenContract = new web3.eth.Contract(tokenAbi,token.address)
 		const balance = await tokenContract.methods.balanceOf(accountAddr).call() / DEX18
 		tokenList += "<li class=\"token\" onclick=\"choiceToken('" 
 		+ token.symbol
 		+ "')\"> <div class=\"tokenImg\"><img src="
 		+ image
 		+ "> </div> <div class=\"tokenInfo\"> <div class=\"tokenSymbol\">"
 		+ token.symbol
 		+"</div> <div class=\"tokenName\">"
		+ token.name
		+ "</div> </div> <div class=\"tokenBalance\">"
		+ balance
		+ "</div> </li>"
 	}
	document.getElementById("tokenListBox").innerHTML = tokenList
 }
 
 async function choiceToken(symbol){

 	for(token of tokenDatas){
 		if(token.symbol != symbol){
 			continue;
 		}
 		currentToken = token.address;
 		document.getElementById('tokenInButton').innerHTML=symbol;
 		currentTokenContract = new web3.eth.Contract(tokenAbi,token.address)
 		document.getElementById('balance').innerHTML = currentTokenBalance = (await currentTokenContract.methods.balanceOf(accountAddr).call() / DEX18).toFixed(4)
 		const stToken = await poolContract.methods.stakedOf(currentToken).call()
 		if(stToken != emptyAddr){
 			const stTokenContract = new web3.eth.Contract(tokenAbi,stToken)
 	 		const stBal = await stTokenContract.methods.balanceOf(accountAddr).call() / DEX18
 	 		document.getElementById('deposited').innerHTML= await convertStToOrg(stBal);	
 		}else{
 			document.getElementById('deposited').innerHTML=0;
 		}
 		modalOff()
 		checkAllowance()
 		break;
 	}
 }
 
 async function checkDeposit(){
	 const amount = String(mul18(document.getElementById('amount').value))
	 const approveState = document.getElementById('approve').style.display;
	 if( amount > currentTokenBalance || approveState=='flex' ){
		 document.getElementById('action').classList.add('disable')
	 }else{
		 document.getElementById('action').classList.remove('disable')
	 }
	 
 }
 
 async function checkAllowance(){
	 if(!currentToken){
		 return;
	 }
	 const allowance = await currentTokenContract.methods.allowance(accountAddr,poolAddr).call()
	 const amount = mul18(document.getElementById('amount').value) 
	 if(amount > allowance){
		 document.getElementById('approve').style.display = "flex";
	 }else{
		 document.getElementById('approve').style.display = "none";
	 }
	 txFee()
	 checkDeposit()
 }
 
 async function approve(){
	 const amount = String(mul18(document.getElementById('amount').value)) 
	 await currentTokenContract.methods.approve(poolAddr,amount).send({from:accountAddr})
 }
 
async function deposit(){
	const amount = String(mul18(document.getElementById('amount').value))
	await poolContract.methods.stake(currentToken,amount).send(txOption)
}

async function txFee(){
	const gwei = 1 * DEX9;
	
	const baseFee = await web3.eth.getBlock("latest").then((block) => {return Number(block.baseFeePerGas)})
	
	const priorityFee = await web3.eth.getFeeHistory(1, "latest", [50]).then((feeHistory) => {
	  	const blocks = formatFeeHistory(feeHistory);
	  	const priority = blocks[0].priorityFeePerGas[0];
	  	if(priority < gwei){
	  		return gwei
	  	}
	  	return priority;
	});
	
	let units = 0
	
	if(document.getElementById('amount').value > 0){
		
		const amount = String(mul18(document.getElementById('amount').value))
		units = await poolContract.methods.stake(currentToken,amount).estimateGas({from:accountAddr})
		if(units < 21000){
			units = 21000
		}
		txOption = {
			from : accountAddr,
			maxPriorityFeePerGas : priorityFee,
			maxFeePerGas : baseFee + priorityFee,
			gasLimit : units > 21000 ? units : 21000
		}	
	}
	document.getElementById("fee").innerHTML = ((baseFee + priorityFee) * units / DEX18).toFixed(4)
}

function formatFeeHistory(result) {
	let blockNum = web3.utils.hexToNumber(result.oldestBlock)
	let index = 0;
	const blocks = [];
	blocks.push({
		number: blockNum,
		baseFeePerGas: Number(result.baseFeePerGas[index]),
		gasUsedRatio: Number(result.gasUsedRatio[index]),
		priorityFeePerGas: result.reward[index].map(x => Number(x)),
    });
	return blocks;
}

async function convertStToOrg(deposited){
	const stToken = await poolContract.methods.stakedOf(currentToken).call()
	const stTokenContract = new web3.eth.Contract(tokenAbi,stToken)
	const totalSupply = await stTokenContract.methods.totalSupply().call()
	const totalDeposited = await currentTokenContract.methods.balanceOf(stToken).call()
	const amount = deposited * totalDeposited / totalSupply
	return amount
}
</script>
</body>
</html>
