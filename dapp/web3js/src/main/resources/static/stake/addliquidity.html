<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="./../js/tool.js"></script>
<script src="./../js/include.js"></script>
<script src="./../js/tokenDatas.js"></script>
<script src="../../js/tokenAbi.js"></script>
<script src="../../js/pairAbi.js"></script>
<script src="./../js/stakeAbi.js"></script>
<script src="./../js/modal.js"></script>
<script src="./../js/loading.js"></script>
<link rel="stylesheet" type="text/css" href="../css/addliquidity.css">
<title>addLiquidity</title>
</head>
<body>
<div id=page-wrapper>
	<header data-include="../include/header.html"></header>
	<div id="main-wrapper">
		<div id="head">
			Add Liquidity
			<div id="headRight">
				use current ratio
				<input id="useRatio" type="checkbox" checked />
			</div>
		</div>
		<div id="group_A" class="token">
			<input id="input_A" type="number" oninput="checkOpp('A')" value="0.0"/>
			<div id=token_A class="tokenChoice">
				<button id="symbol_A" class="searchToken" onclick="modalOn('A')">tokenList</button>
				<div class="deposited_box">deposited : <span id="deposited_A">0</span></div>
			</div>
		</div>
		<div id="equality">=</div>
		<div id="group_B" class="token">
			<input id="input_B" type="number" oninput="checkOpp('B')" value="0.0"/>
			<div id=token_B class="tokenChoice">
				<button id="symbol_B" class="searchToken" onclick="modalOn('B')">tokenList</button>
				<div class="deposited_box">deposited : <span id="deposited_B">0</span></div>
			</div>
		</div>
		<div id="liquidity" class="info">
			<div id="reservLeft" class="reserve">
				<div id="reservLeftToken"></div>
				<div id="reservLeftAmount"></div>
			</div>
			<div style="font-weight: bolder; font-size: xx-large;">:</div>
			<div id="reservRight" class="reserve">
				<div id="reservRightToken"></div>
				<div id="reservRightAmount"></div>
			</div>
		</div>
		<div id="brandnew" class="info">
			<h1>Brand New Liquidity</h1>
		</div>
		<div class="info" style="display: flex;">
			<div class="fee_box">transaction fee</div>
			<div class="fee_box"><span id="fee">0</span> ETH</div>
		</div>
		<div id="empty"></div>
		<div id="action" class="token disable" onclick="addLiquidity()">
			<h1>Add Liquidity</h1>
		</div>
	</div>
</div>

<modal data-include="../include/modal.html" ></modal>
<modal data-include="../include/loading.html" ></modal>

<script type="text/javascript">
let web3;
let accountAddr;
const curtoken = {"A":{},"B":{}};
let pair={};
let txOption;
let target;
const pool = {"address":stakingPoolAddress};
const emptyAddr = "0x0000000000000000000000000000000000000000";
const DEX18 = 10**18 
const DEX9 = 10**9 

async function connect(){
	try{
		const address = await web3.eth.requestAccounts()
		accountAddr = address[0]
		document.getElementById('connect').innerHTML = accountAddr.slice(0,7) + '...'
		pool["contract"] = new web3.eth.Contract(stakingPoolAbi,pool["address"])
	}catch(e){
		alert('fail to request account')
		return
	}
}

window.onload = function(){
	if(window.ethereum){
		web3 = new Web3(window.ethereum)
		document.getElementById('connect').innerHTML='connect wallet'
		connect()
	}else{
		document.getElementById('connect').innerHTML='메타마스크가 없습니다'	
	}
}
    
async function modalOn(_target) {
	target = _target
	showLoading();
	await tokenList()
	hideLoading();
	modalShow()
}

async function tokenList(){
	let tokenList = "";
	const filter = document.getElementById("filter").value;
	
	for(token of tokenDatas){
		if(filter && ( !token.symbol.includes(filter) && !token.name.includes(filter))){
			continue;
		}
		
		const tokenInfo = await getTokenInfo(token)
		
 		const image = token.image ? token.image : "../img/white.webp"

 		tokenList += tokenItem(token.symbol, image, token.name, tokenInfo["deposited"])
 	}
	document.getElementById("tokenListBox").innerHTML = tokenList;
}

async function choiceToken(symbol){

 	for(token of tokenDatas){
 		if(token.symbol != symbol){
 			continue;
 		}
 		document.getElementById('symbol_'+target).innerHTML = symbol;
 		curtoken[target] = await getTokenInfo(token);
 		document.getElementById('deposited_'+target).innerHTML = curtoken[target]["deposited"] 
 		break;
 	}
 	
 	target="";
		
	modalOff()
	
	await checkPair()
}

async function getTokenInfo(token){
	const targetToken = {"address":token.address};
	targetToken["symbol"] = token.symbol
	targetToken["stAddress"] = await pool["contract"].methods.stakedOf(targetToken["address"]).call()
	if(targetToken["stAddress"] != emptyAddr){
		targetToken["contract"] = new web3.eth.Contract(tokenAbi,targetToken["address"])
		targetToken["stContract"] = new web3.eth.Contract(tokenAbi,targetToken["stAddress"])
		targetToken["stBalance"] = await targetToken["stContract"].methods.balanceOf(accountAddr).call();
 		const { minted, reserved } = await pool["contract"].methods.mintedByReserved(token.address).call();
 		targetToken["totalSupply"] = minted;
 		targetToken["totalDeposited"] = reserved; 
 		targetToken["deposited"] = (targetToken["stBalance"] / DEX18 * targetToken["totalDeposited"] / targetToken["totalSupply"]).toFixed(4)
	}else{
		targetToken["deposited"] = 0;
	}
	return targetToken;
}

async function checkPair(){
	if( !curtoken["A"]["stAddress"] || !curtoken["B"]["stAddress"] ){
		return;
	}
	
	pair["address"] = await findPair(curtoken["A"]["stAddress"],curtoken["B"]["stAddress"])
	
	if(pair["address"] == emptyAddr){
		document.getElementById("brandnew").style.display="flex";
		document.getElementById("liquidity").style.display="none";
		curtoken["A"]["reserved"] = null;
		curtoken["B"]["reserved"] = null;
		return;
	}else{
		document.getElementById("brandnew").style.display="none";
		document.getElementById("liquidity").style.display="flex";
	}
	
	pair["contract"] = new web3.eth.Contract(pairAbi,pair["address"])
	const { 0:amountA, 1:amountB } = await pair["contract"].methods.getReserves().call()
	
	if( curtoken["A"]['stAddress'] < curtoken["B"]['stAddress'] ){
		curtoken["A"]["reserved"] = amountA;
		curtoken["B"]["reserved"] = amountB;
	}else{
		curtoken["A"]["reserved"] = amountB;
		curtoken["B"]["reserved"] = amountA;
	}
	document.getElementById("reservLeftToken").innerHTML= curtoken["A"]["symbol"] 
	document.getElementById("reservLeftAmount").innerHTML=(curtoken["A"]["reserved"] * curtoken["A"]["totalDeposited"] / curtoken["A"]["totalSupply"] / DEX18).toFixed(4)
	document.getElementById("reservRightToken").innerHTML= curtoken["B"]["symbol"]
	document.getElementById("reservRightAmount").innerHTML=(curtoken["B"]["reserved"] * curtoken["B"]["totalDeposited"] / curtoken["B"]["totalSupply"] / DEX18).toFixed(4)
	
}
 
async function checkOpp(_target){
	const checkBox = document.getElementById("useRatio").checked
	
	const input = document.getElementById("input_"+_target).value;
	
	const stInput = input * curtoken[_target]["totalSupply"] / curtoken[_target]["totalDeposited"];

	const opp = _target == "A" ? "B" : "A";
	
	if(pair["address"] != emptyAddr && checkBox ){
		const stOutput = stInput * curtoken[opp]["reserved"] / curtoken[_target]["reserved"];
		
		const output = stOutput * curtoken[opp]["totalDeposited"] / curtoken[opp]["totalSupply"];
		
		document.getElementById("input_"+opp).value = output;
	}
	
	document.getElementById('action').classList.remove('disable')
	
	txFee()
}

async function txFee(){
	
	const amountA = document.getElementById("input_A").value * curtoken["A"]["totalSupply"] / curtoken["A"]["totalDeposited"] * DEX18
	const amountB = document.getElementById("input_B").value * curtoken["B"]["totalSupply"] / curtoken["B"]["totalDeposited"] * DEX18 
	
	if(amountA <= 0 || amountB <=0){
		return
	}
	
	const baseFee = await web3.eth.getBlock("latest").then((block) => {return Number(block.baseFeePerGas)})
	
	const priorityFee = await web3.eth.getFeeHistory(1, "latest", [50]).then(getPriorityByFeehistory);
	
	let units = 0
	
	units = await pool["contract"].methods.addLiquidity(
		curtoken["A"]["stAddress"],
		curtoken["B"]["stAddress"],
		String(amountA),
		String(amountB),
		"0","0"
	).estimateGas({from:accountAddr});
	
	if(units < 21000){
		units = 21000
	}
	txOption = {
		from : accountAddr,
		maxPriorityFeePerGas : priorityFee,
		maxFeePerGas : baseFee + priorityFee,
		gasLimit : units > 21000 ? units : 21000
	}	
	document.getElementById("fee").innerHTML = ((baseFee + priorityFee) * units / DEX18).toFixed(4)
}
 
async function addLiquidity(){
	await pool["contract"].methods.addLiquidity(
		curtoken["A"]["stAddress"],
		curtoken["B"]["stAddress"],
		String(document.getElementById("input_A").value * curtoken["A"]["totalSupply"] / curtoken["A"]["totalDeposited"] * DEX18),
		String(document.getElementById("input_B").value * curtoken["B"]["totalSupply"] / curtoken["B"]["totalDeposited"] * DEX18),
		"0","0"
	).send(txOption);
	target = "A"
	await choiceToken(curtoken["A"]["symbol"])
	target = "B"
	await choiceToken(curtoken["B"]["symbol"])
}
 
async function findPair(_tA, _tB){
	const { tA, tB } = _tA < _tB ? { tA:_tA, tB:_tB } : { tA:_tB, tB:_tA } 
	return await pool["contract"].methods.pairOf(tA,tB).call();
}
</script>
</body>
</html>
